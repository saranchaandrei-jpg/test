[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-package"
version = "0.1.0"
description = "Sample Python package demonstrating a packaging manifest (MANIFEST.in) setup"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/saranchaandrei-jpg/test"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sample_package = ["py.typed", "data/*.json"]
